name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production --base-href /tartan_cottage/

      - name: Diagnostic: list build output
        if: always()
        run: |
          echo "--- ls -la ./dist ---"
          ls -la ./dist || true
          echo "--- ls -R ./dist/tartan-cottage ---"
          ls -R ./dist/tartan-cottage || true
          echo "--- head of index.html ---"
          if [ -f ./dist/tartan-cottage/index.html ]; then
            head -n 40 ./dist/tartan-cottage/index.html
          else
            echo "index.html not found"
          fi

      - name: Add 404 fallback (optional)
        run: |
          if [ -d ./dist/tartan-cottage ]; then
            cp ./dist/tartan-cottage/index.html ./dist/tartan-cottage/404.html || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/tartan-cottage

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
